<style>
:root{--y:#FFD400;--on:#000;--bg:#000;--t:#f2f2f2;--m:#8d8d8d;--l:#262626;--card:#0d0d0d;--ib:#3a3a3a;--ok:#4ade80;--bad:#ff5c5c;color-scheme:dark}
:root[data-theme=light]{--y:#667a1c;--on:#fff;--bg:#f6f7f1;--t:#1c1f14;--m:#666b5a;--l:#d9dccb;--card:#e9ecdb;--ib:#b9bfa3;--ok:#2e7d32;--bad:#c62828;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 "Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0;color:var(--y)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sw{flex:none;position:relative;width:52px;height:28px;border-radius:14px;border:2px solid var(--y);background:transparent;padding:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--y);transition:transform .15s}
.sw[aria-checked=true]::after{transform:translateX(24px)}
.sw:focus-visible{outline:3px solid var(--t);outline-offset:2px}
[hidden]{display:none!important}
.lb,label{display:block;font-size:13px;color:var(--m);margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.b,select{font:inherit;font-size:17px;font-weight:600;min-height:48px;border:2px solid var(--y);background:transparent;color:var(--y);border-radius:10px;padding:10px 16px;cursor:pointer}
.row .b{flex:1 1 auto}
.b.on{background:var(--y);color:var(--on)}
.b:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--t);outline-offset:2px}
select{background:var(--bg);width:100%;margin-top:6px}
select option{background:var(--bg);color:var(--y)}
input{display:block;margin-top:6px;font:inherit;font-size:17px;min-height:48px;width:100%;background:var(--card);border:1px solid var(--ib);color:var(--t);border-radius:8px;padding:9px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.sp{margin-top:14px}
.tr{display:flex;align-items:center;gap:12px}
.b.sm.ai{width:36px;height:36px;min-height:36px;border-radius:50%;font-size:14px;padding:0}
.aip{border:2px solid var(--y);border-radius:12px;padding:12px;margin-bottom:14px}
textarea{display:block;width:100%;font:inherit;font-size:17px;background:var(--card);border:1px solid var(--ib);color:var(--t);border-radius:8px;padding:9px 10px;resize:vertical}
.aist{font-size:13px;color:var(--m);margin-top:8px}.aist.bad{color:var(--bad)}
#aimic.on{background:var(--y);color:var(--on)}
.proj{margin-bottom:14px}
.cons{border-top:2px solid var(--y);padding:14px 0 22px}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd h2{margin:0;font-size:20px;color:var(--y)}
.act{display:flex;gap:8px}
.b.sm.cp{width:auto;padding:0 12px;font-size:14px}
.b.sm{min-height:34px;width:40px;padding:0;font-size:20px;line-height:1;border-radius:8px}
.res{border:2px solid var(--y);border-radius:12px;padding:16px;margin-top:16px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:12px}
.big div{background:var(--card);border-radius:10px;padding:12px}
.big small{display:block;color:var(--m);font-size:13px}
.big b{font-size:26px;color:var(--y)}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 0;border-top:1px solid var(--l)}
td:last-child{text-align:right;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.chk{margin:12px 0 0;padding:0;list-style:none}
.chk li{padding:3px 0}
#sum h2{font-size:17px;margin:18px 0 6px;color:var(--y)}
.pdf{width:100%;margin-top:18px}
.pdf:disabled{opacity:.6;cursor:wait}
.note{color:var(--m);font-size:12.5px;margin-top:18px}
</style>
</head>
<body>
<main>
<div class="top"><h1>Кабел и прекъсвач</h1>
<div class="tr"><button type="button" id="aib" class="b sm ai" aria-label="AI асистент" title="AI асистент" aria-expanded="false">AI</button><button type="button" id="th" class="sw" role="switch" aria-label="Светъл или тъмен фон" aria-checked="false"></button></div></div>
<div id="ai" class="aip" hidden>
 <label for="aitxt">Кажете или напишете какво да се попълни</label>
 <textarea id="aitxt" rows="3" placeholder="напр. Бойлер 2 киловата, 15 метра, СВТ, монофазен. Фурна 7 kW, 30 метра, трифазен."></textarea>
 <div class="row sp"><button type="button" class="b" id="aimic" hidden aria-label="Диктувай" title="Диктувай">🎤</button><button type="button" class="b on" id="aigo">Попълни</button></div>
 <div id="aist" class="aist" aria-live="polite"></div>
 <div id="aimode" class="aist"></div>
</div>
<div class="grid proj">
 <label>Проект<input data-p="name" type="text" placeholder="напр. Къща – Иванов"></label>
 <label>Обект<input data-p="obj" type="text" placeholder="напр. Главно табло"></label>
 <label>Изготвил<input data-p="by" type="text"></label>
</div>
<div id="list"></div>
<button type="button" class="b sm" id="add" aria-label="Добави консуматор" title="Добави консуматор">+</button>
<div id="sum"></div>
<button type="button" class="b pdf" id="pdf" hidden>Изтегли PDF</button>
<p class="note">Ориентировъчно изчисление за многожилни кабели по каталога на Филкаб. Токът на к.с. не отчита импеданса на източника. Проверете по действащите норми.</p>
</main>
<script>
const $=id=>document.getElementById(id);
const g=a=>({2:a,3:a});
const CU=[1.5,2.5,4,6,10,16,25,35,50,70,95,120,150,185,240];
const svtG=[25,34,45,55,76,96,126,151,178,225,270,306,346,390,458];
const svtA=[19,25,34,43,59,79,105,126,157,199,246,285,326,374,445];
const AL=[2.5,4,6,10,16,25,35,50,70,95,120,150,185,240];
const T={
 svt:{n:'СВТ',m:'Cu',s:CU,md:{'В земя':g(svtG),'Във въздух':g(svtA)}},
 nym:{n:'Мостов кабел (NYM)',m:'Cu',s:[1.5,2.5,4,6,10,16],md:{
  'A2 – тръба в изолирана стена':{2:[15.5,18.5,25,32,43,57],3:[13,17.5,23,29,39,52]},
  'B2 – тръба или канал по стена':{2:[16.5,23,30,38,52,69],3:[15,20,27,34,46,62]},
  'C – директно върху стена':{2:[19.5,27,36,46,63,85],3:[17.5,24,32,41,57,76]},
  'E – свободно във въздух':{2:[22,30,40,51,70,94],3:[18.5,25,34,43,60,80]}}},
 savt:{n:'САВТ',m:'Al',s:AL,md:{'В земя':g([25,32,42,53,75,92,110,134,170,210,245,274,310,360]),'Във въздух':g([20,26,34,43,64,82,100,119,152,185,215,245,285,338])}},
 nyy:{n:'NYY',m:'Cu',s:CU,md:{'В земя':g([27,36,47,59,79,102,133,159,188,232,280,318,359,406,473]),'Във въздух':g([19.5,25,34,43,59,79,106,129,157,199,246,285,326,374,445])}},
 svtc:{n:'СВТ-с',m:'Cu',s:CU,md:{'В земя':g(svtG),'Във въздух':g(svtA)}},
 nayy:{n:'NAYY',m:'Al',s:[25,35,50,70,95,120,150,185,240,300],md:{'В земя':g([102,123,144,179,215,245,275,313,364,419]),'Във въздух':g([82,100,119,152,186,216,246,285,338,400])}}
};
const MAIN={Cu:['svt','nym'],Al:['savt']}, OTH={Cu:['nyy','svtc'],Al:['nayy']};
const STD=[6,10,13,16,20,25,32,40,50,63,80,100,125,160,200,250,315,400,500,630];
const MAG={B:[3,5],C:[5,10],D:[10,20]};
const RO={Cu:[0.0214,0.0267],Al:[0.0344,0.043]};
const mk=()=>({name:'',tri:0,mat:'Cu',type:'svt',mode:null,ch:'C',auto:1,p:'7',pf:'1',l:'30',du:'3',sec:'',br:'',last:{}});
let lines=[mk()],theme='dark',proj={name:'',obj:'',by:''};
const title=(s,i)=>'Консуматор '+(i+1)+(s.name?' – '+s.name:'');
try{theme=localStorage.getItem('kp-theme')||'dark';}catch(e){}
const f=(n,d=1)=>n.toLocaleString('bg-BG',{maximumFractionDigits:d});

function btns(c,items,sel,fn){c.innerHTML='';items.forEach(([k,l])=>{const b=document.createElement('button');b.type='button';b.className='b'+(k===sel?' on':'');b.textContent=l;b.onclick=()=>fn(k);c.appendChild(b);});}

function compute(s){
 const P=+s.p*1000,pf=Math.min(1,Math.max(.1,+s.pf||1)),L=+s.l,lim=+s.du||3;
 if(!(P>0)||!(L>0))return{err:'Въведете мощност и дължина на кабела.'};
 const tri=s.tri,U=tri?400:230,t=T[s.type],mode=t.md[s.mode]?s.mode:Object.keys(t.md)[0],arr=t.md[mode][tri?3:2],ro=RO[t.m];
 const Ib=tri?P/(Math.sqrt(3)*U*pf):P/(U*pf);
 const k=tri?Math.sqrt(3):2,sinf=Math.sqrt(1-pf*pf);
 const dv=j=>k*Ib*L*(ro[0]/t.s[j]*pf+0.00008*sinf);
 const In=(!s.auto&&+s.br)||STD.find(x=>x>=Ib);
 if(!In)return{err:'Токът на товара ('+f(Ib)+' A) е над 630 A – няма стандартен прекъсвач в списъка.'};
 let i,fail=false;
 const [mn,mx]=MAG[s.ch],ik=j=>0.95*230/(ro[1]*2*L/t.s[j]);
 if(!s.auto&&s.sec&&t.s.includes(+s.sec))i=t.s.indexOf(+s.sec);
 else{i=t.s.findIndex((x,j)=>arr[j]>=In&&dv(j)/U*100<=lim&&ik(j)>=mx*In);if(i<0){fail=true;i=t.s.length-1;}}
 const S1=t.s[i],Iz=arr[i],d=dv(i),dp=d/U*100,Ik=ik(i);
 const cores=tri?(S1<=95?'5×':'4×')+f(S1):'3×'+f(S1);
 const c=[[Ib<=In,'Прекъсвачът е достатъчен за товара','Прекъсвачът е по-малък от тока на товара'],
  [In<=Iz,'Кабелът е защитен от претоварване','Прекъсвачът е по-голям от допустимия ток на кабела'],
  [dp<=lim,'Падът на напрежение е в допустимия предел','Падът на напрежение надвишава '+f(lim)+' %'],
  [Ik>=mx*In,'При к.с. в края на линията изключва бързо','Токът на к.с. в края е малък за бързо изключване – вземете по-голямо сечение или по-ниска характеристика']];
 return{t,Ib,In,S1,Iz,d,dp,mn,mx,Ik,cores,c,fail,lim,ch:s.ch};
}

function card(s){
 const el=document.createElement('section');el.className='cons';
 const q=x=>el.querySelector(x);
 el.innerHTML=`<div class="hd"><h2></h2><span class="act"><button type="button" class="b sm cp" aria-label="Копирай консуматора" title="Копирай консуматора">Копирай</button> <button type="button" class="b sm x" aria-label="Изтрий консуматор" title="Изтрий консуматор">×</button></span></div>
 <label>Име на консуматора<input data-k="name" type="text" placeholder="напр. Бойлер"></label>
 <span class="lb sp">Фазност</span><div class="row ph"></div>
 <div class="grid sp">
  <label>Мощност (kW)<input data-k="p" type="number" min="0" step="0.1" inputmode="decimal"></label>
  <label>cos φ<input data-k="pf" type="number" min="0.1" max="1" step="0.01" inputmode="decimal"></label>
  <label>Дължина (m)<input data-k="l" type="number" min="1" step="1" inputmode="decimal"></label>
  <label>Допустим пад (%)<input data-k="du" type="number" min="0.5" step="0.5" inputmode="decimal"></label>
 </div>
 <span class="lb sp">Проводник</span><div class="row mat"></div>
 <span class="lb sp">Кабел – най-често ползвани</span><div class="row main"></div>
 <label class="sp">Други кабели<select class="oth"></select></label>
 <span class="lb sp">Начин на полагане</span><div class="row mode"></div>
 <span class="lb sp">Избор на кабел и прекъсвач</span><div class="row am"></div>
 <div class="grid sp man" hidden>
  <label>Сечение на кабела<select class="sec"></select></label>
  <label>Прекъсвач (A)<select class="br"></select></label>
 </div>
 <span class="lb sp">Характеристика на прекъсвача</span><div class="row ch"></div>
 <div class="res" aria-live="polite"></div>`;
 const redo=()=>{const n=card(s);el.replaceWith(n);n.querySelector('.res');calcCard(n,s);sum();};
 q('.hd h2').textContent=title(s,lines.indexOf(s));
 q('.cp').onclick=()=>{const k=lines.indexOf(s);lines.splice(k+1,0,{...s,last:{}});renderAll();$('list').children[k+1].scrollIntoView({behavior:'smooth',block:'start'});};
 q('.x').hidden=lines.length<2;
 q('.x').onclick=()=>{lines.splice(lines.indexOf(s),1);renderAll();};
 el.querySelectorAll('input').forEach(i=>{i.value=s[i.dataset.k];i.addEventListener('input',()=>{s[i.dataset.k]=i.value;if(i.dataset.k==='name')q('.hd h2').textContent=title(s,lines.indexOf(s));calcCard(el,s);sum();});});
 btns(q('.ph'),[[0,'Монофазен (230 V)'],[1,'Трифазен (400 V)']],s.tri,k=>{s.tri=k;redo();});
 btns(q('.mat'),[['Cu','Мед'],['Al','Алуминий']],s.mat,k=>{s.mat=k;s.type=MAIN[k][0];s.mode=null;s.sec='';redo();});
 btns(q('.main'),MAIN[s.mat].map(k=>[k,T[k].n]),s.type,k=>{s.type=k;s.mode=null;s.sec='';redo();});
 q('.oth').innerHTML='<option value="">Избери друг кабел…</option>'+OTH[s.mat].map(k=>`<option value="${k}">${T[k].n}</option>`).join('');
 q('.oth').value=OTH[s.mat].includes(s.type)?s.type:'';
 q('.oth').onchange=e=>{if(e.target.value){s.type=e.target.value;s.mode=null;s.sec='';redo();}};
 const t=T[s.type],modes=Object.keys(t.md);
 if(!modes.includes(s.mode))s.mode=modes[0];
 btns(q('.mode'),modes.map(m=>[m,m]),s.mode,k=>{s.mode=k;redo();});
 btns(q('.am'),[[1,'Авто'],[0,'Ръчно']],s.auto,k=>{s.auto=k;if(!k&&s.last.s){s.sec=String(s.last.s);s.br=String(s.last.in);}redo();});
 q('.man').hidden=!!s.auto;
 q('.sec').innerHTML=t.s.map(x=>`<option value="${x}">${f(x)} mm²</option>`).join('');
 q('.br').innerHTML=STD.map(x=>`<option value="${x}">${x} A</option>`).join('');
 if(!t.s.map(String).includes(String(s.sec)))s.sec=String(s.last.s&&t.s.includes(s.last.s)?s.last.s:t.s[0]);
 if(!s.br)s.br=String(s.last.in||STD[0]);
 q('.sec').value=s.sec;q('.br').value=s.br;
 q('.sec').onchange=e=>{s.sec=e.target.value;calcCard(el,s);sum();};
 q('.br').onchange=e=>{s.br=e.target.value;calcCard(el,s);sum();};
 btns(q('.ch'),['B','C','D'].map(c=>[c,c]),s.ch,k=>{s.ch=k;redo();});
 calcCard(el,s);
 return el;
}

function calcCard(el,s){
 const o=compute(s),R=el.querySelector('.res');
 if(o.err){R.innerHTML=o.err;return;}
 s.last={s:o.S1,in:o.In};
 R.innerHTML=(o.fail?'<p class="bad">В каталога няма сечение, което отговаря на всички условия. Показано е най-голямото. Намалете дължината или увеличете допустимия пад.</p>':'')+
 `<div class="big"><div><small>Прекъсвач</small><b>${o.ch}${o.In} A</b></div><div><small>Кабел</small><b>${o.t.n} ${o.cores} mm²</b></div></div>
 <table>
 <tr><td>Ток на товара</td><td>${f(o.Ib)} A</td></tr>
 <tr><td>Допустим ток на кабела</td><td>${f(o.Iz)} A</td></tr>
 <tr><td>Пад на напрежение</td><td class="${o.dp<=o.lim?'ok':'bad'}">${f(o.d,2)} V · ${f(o.dp,2)} %</td></tr>
 <tr><td>Изключва при претоварване (1,45 × In)</td><td>${f(1.45*o.In)} A</td></tr>
 <tr><td>Моментално (${o.ch}: ${o.mn}–${o.mx} × In)</td><td>${f(o.mn*o.In,0)} – ${f(o.mx*o.In,0)} A</td></tr>
 <tr><td>Ток на к.с. в края (прибл.)</td><td>${f(o.Ik,0)} A</td></tr>
 </table>
 <ul class="chk">${o.c.map(([ok,y,n])=>`<li class="${ok?'ok':'bad'}">${ok?'✓ '+y:'✗ '+n}</li>`).join('')}</ul>`;
}

function sum(){
 if(lines.length<2){$('sum').innerHTML='';return;}
 $('sum').innerHTML='<h2>Всички консуматори</h2><table>'+lines.map((s,i)=>{
  const o=compute(s);
  if(o.err)return`<tr><td>${esc(title(s,i))}</td><td>липсват данни</td></tr>`;
  const ok=o.c.every(x=>x[0])&&!o.fail;
  return`<tr><td>${esc(title(s,i))}<br><small>${o.t.n} ${o.cores} mm²</small></td><td class="${ok?'ok':'bad'}">${o.ch}${o.In} A · ${f(o.dp,1)} %</td></tr>`;}).join('')+'</table>';
}

function renderAll(){
 const L=$('list');L.innerHTML='';
 lines.forEach(s=>L.appendChild(card(s)));
 sum();
}

function themeBtns(){
 document.documentElement.dataset.theme=theme;
 $('th').setAttribute('aria-checked',theme==='light');
}
$('th').onclick=()=>{theme=theme==='light'?'dark':'light';try{localStorage.setItem('kp-theme',theme);}catch(e){}themeBtns();};

$('add').onclick=()=>{const last=lines[lines.length-1];lines.push({...last,last:{}});renderAll();$('list').lastElementChild.scrollIntoView({behavior:'smooth',block:'start'});};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DL=null;
(async()=>{try{DL=window.claude?await claude.use('downloads'):null;}catch(e){DL=null;}$('pdf').hidden=false;})();
function report(){
 const th='border:1px solid #444;padding:5px 6px;background:#e8e8e8;text-align:left;font-weight:700',td='border:1px solid #444;padding:5px 6px;vertical-align:top';
 const rows=lines.map((s,i)=>{
  const o=compute(s);
  if(o.err)return`<tr><td style="${td}">${i+1}</td><td style="${td}" colspan="9">${esc(o.err)}</td></tr>`;
  const bad=o.c.filter(x=>!x[0]).map(x=>x[2]);
  const mode=T[s.type].md[s.mode]?s.mode:Object.keys(T[s.type].md)[0];
  return`<tr><td style="${td}">${i+1}</td>
  <td style="${td}">${s.name?'<b>'+esc(s.name)+'</b><br>':''}${s.tri?'3~ 400 V':'1~ 230 V'}<br>${esc(s.p)} kW<br><span style="white-space:nowrap">cos φ ${esc(s.pf)}</span><br>${esc(s.l)} m</td>
  <td style="${td}">${esc(o.t.n)} ${esc(o.cores)} mm²<br>${esc(mode)}</td>
  <td style="${td}">${esc(o.ch)}${o.In} A</td>
  <td style="${td}">${f(o.Ib)} A</td>
  <td style="${td}">${f(o.Iz)} A</td>
  <td style="${td}">${f(o.d,2)} V<br>${f(o.dp,2)} %</td>
  <td style="${td}">${f(o.mn*o.In,0)}–${f(o.mx*o.In,0)} A</td>
  <td style="${td}">${f(o.Ik,0)} A</td>
  <td style="${td}">${bad.length?esc(bad.join('; ')):'Всички проверки са изпълнени'}</td></tr>`;}).join('');
 const el=document.createElement('div');
 el.style.cssText='box-sizing:border-box;width:1040px;padding:8px;background:#fff;color:#000;font:12px/1.35 Arial,sans-serif';
 el.innerHTML=`<h1 style="font-size:20px;margin:0 0 4px;color:#000">Разчет на кабели и защитни прекъсвачи</h1>
 <div style="margin-bottom:12px">${proj.name?'Проект: <b>'+esc(proj.name)+'</b><br>':''}${proj.obj?'Обект: <b>'+esc(proj.obj)+'</b><br>':''}${proj.by?'Изготвил: <b>'+esc(proj.by)+'</b><br>':''}Дата: ${new Date().toLocaleDateString('bg-BG')}</div>
 <table style="width:100%;border-collapse:collapse"><thead><tr>
 <th style="${th}">№</th><th style="${th}">Консуматор</th><th style="${th}">Кабел</th><th style="${th}">Прекъсвач</th><th style="${th}">Ток на товара Ib</th><th style="${th}">Допустим ток Iz</th><th style="${th}">Пад на напрежение</th><th style="${th}">Моментално изключване</th><th style="${th}">Ток на к.с. в края</th><th style="${th}">Бележки</th>
 </tr></thead><tbody>${rows}</tbody></table>
 <p style="margin-top:12px;font-size:10px;color:#333">Допустими токове по каталога на Филкаб. Ориентировъчно изчисление: падът на напрежение е при 70 °C, токът на к.с. не отчита импеданса на източника. Да се провери по действащите норми.</p>`;
 return el;
}
function printReport(){
 const el=report();el.style.width='100%';
 const doc='<!doctype html><html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Разчет на кабели</title></head><body style="margin:0">'+el.outerHTML+'</body></html>';
 if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.pdf){webkit.messageHandlers.pdf.postMessage(doc);return;}
 const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
 document.body.appendChild(fr);
 const d=fr.contentWindow.document;d.open();
 d.write('<!doctype html><html lang="bg"><head><meta charset="utf-8"><title>Разчет на кабели</title><style>@page{size:A4 landscape;margin:10mm}body{margin:0}</style></head><body>'+el.outerHTML+'</body></html>');d.close();
 setTimeout(()=>{fr.contentWindow.focus();fr.contentWindow.print();setTimeout(()=>fr.remove(),3000);},300);
}
$('pdf').onclick=async()=>{
 if(!DL){printReport();return;}
 try{
  const el=report();el.style.width='100%';
  const doc='<!doctype html><html lang="bg"><head><meta charset="utf-8"><title>Разчет на кабели</title><style>@page{size:A4 landscape;margin:10mm}body{margin:0}</style></head><body>'+el.outerHTML+'</body></html>';
  await DL.save({filename:'razchet-kabeli.html',data:doc});
 }catch(e){if(!e||e.code!=='declined')printReport();}
};
document.querySelectorAll('[data-p]').forEach(i=>i.addEventListener('input',()=>{proj[i.dataset.p]=i.value;}));

(function(){
 const ta=$('aitxt'),st=$('aist'),panel=$('ai'),go=$('aigo'),mic=$('aimic'),modeEl=$('aimode');
 let SMP=null,DIC=null,rec=null,listening=false;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
 const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;};
 const setSt=(t,bad)=>{st.textContent=t;st.className='aist'+(bad?' bad':'');};
 const upd=()=>{modeEl.textContent=SMP?'Режим: AI асистент':'Режим: основен разбор без AI';mic.hidden=!(DIC||SR);};
 upd();
 const ready=(async()=>{
  try{
   if(window.claude){
    SMP=await claude.use('sample');DIC=await claude.use('dictation');
    if(DIC){
     DIC.onPartial(e=>{if(e.text)setSt('… '+e.text);});
     DIC.onFinal(e=>{ta.value=(ta.value+e.text).replace(/^\s+/,'');});
     DIC.onState(e=>{listening=e.state!=='idle';mic.classList.toggle('on',listening);
      if(e.state==='idle')setSt(e.reason&&['not_granted','unavailable','rate_limited','upstream_error'].includes(e.reason)?'Гласовото въвеждане не е достъпно. Напишете текста.':'',!!e.reason&&e.reason!=='stopped'&&e.reason!=='viewer_stopped'&&e.reason!=='hidden'&&e.reason!=='dismissed');});
    }
   }
  }catch(e){}
  upd();
 })();

 $('aib').onclick=()=>{panel.hidden=!panel.hidden;$('aib').setAttribute('aria-expanded',String(!panel.hidden));if(!panel.hidden)ta.focus();};

 mic.onclick=()=>{
  if(listening){if(DIC)DIC.stop().catch(()=>{});else if(rec)rec.stop();return;}
  if(DIC){DIC.start().catch(e=>{if(e&&e.code!=='dismissed'&&e.code!=='stopped')setSt('Гласовото въвеждане не е достъпно. Напишете текста.',true);});return;}
  if(SR){
   rec=new SR();rec.lang='bg-BG';rec.interimResults=true;rec.continuous=true;
   const base=ta.value;
   rec.onresult=ev=>{let fin='',part='';
    for(let i=0;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal)fin+=r[0].transcript;else part+=r[0].transcript;}
    ta.value=(base+' '+fin+' '+part).trim();};
   rec.onstart=()=>{listening=true;mic.classList.add('on');setSt('Слушам…');};
   rec.onend=()=>{listening=false;mic.classList.remove('on');if(!st.classList.contains('bad'))setSt('');};
   rec.onerror=ev=>setSt(ev.error==='network'?'Гласовото въвеждане изисква интернет. Напишете текста.':'Гласовото въвеждане не се получи. Напишете текста.',true);
   try{rec.start();}catch(e){setSt('Гласовото въвеждане не е достъпно.',true);}
  }
 };

 const STOP=['добави','добавете','нов','нова','ново','консуматор','линия','имам','трябва','ми','да','за','една','един','и','с','на'];
 function localParse(text){
  const segs=text.split(/[.;!?\n]+|\s+(?:и още|след това|също|плюс)\s+/i).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const s of segs){
   const o={name:'',kw:null,length:null,phase:null,cable:null,laying:null,cosphi:null,drop:null,curve:null};
   let m;
   if(m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:kw|квт|киловат\p{L}*)(?!\p{L})/iu))o.kw=num(m[1]);
   else if(m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:w|вт|ват\p{L}*)(?!\p{L})/iu))o.kw=num(m[1])/1000;
   if(m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:метр\p{L}*|м|m)(?!\p{L})/iu))o.length=num(m[1]);
   if(/трифаз|3\s*фаз|(?:380|400)\s*(?:v|волт)/i.test(s))o.phase='3';
   else if(/монофаз|однофаз|1\s*фаз|(?:220|230)\s*(?:v|волт)/i.test(s))o.phase='1';
   if(/свт\s*-\s*с(?!\p{L})/iu.test(s))o.cable='svtc';
   else if(/савт|savt/i.test(s))o.cable='savt';
   else if(/свт|svt/i.test(s))o.cable='svt';
   else if(/мостов|nym|пвв/i.test(s))o.cable='nym';
   else if(/nayy/i.test(s))o.cable='nayy';
   else if(/nyy/i.test(s))o.cable='nyy';
   if(/земя|изкоп|ров(?!\p{L})/iu.test(s))o.laying='ground';
   else if(/тръб|канал|гофр/i.test(s))o.laying='pipe';
   else if(/стена|скара/i.test(s))o.laying='wall';
   else if(/въздух/i.test(s))o.laying='air';
   if(m=s.match(/cos\s*(?:φ|ф|fi|фи)?\s*[=:]?\s*(0[.,]\d+|1)(?!\d)/i))o.cosphi=num(m[1]);
   if(m=s.match(/пад\p{L}*[^\d%]{0,20}(\d+(?:[.,]\d+)?)\s*%/iu))o.drop=num(m[1]);
   if(m=s.match(/характеристик\p{L}*\s*([bcdбсд])(?!\p{L})/iu))o.curve=({'б':'B','с':'C','д':'D'})[m[1].toLowerCase()]||m[1].toUpperCase();
   if(o.kw==null&&o.length==null)continue;
   o.name=s.split(/[\d,]/)[0].split(/\s+/).filter(w=>w&&!STOP.includes(w.toLowerCase())).slice(0,3).join(' ');
   out.push(o);
  }
  return out;
 }

 function prompt(text){
  return 'Ти си помощник за електрически разчети. От текста по-долу (на български, вероятно от гласово диктуване) извлечи списък от консуматори. Върни САМО JSON масив от обекти с полета:\n'+
  '- name: кратко име на уреда (низ, или "")\n'+
  '- kw: мощност в kW (число; преобразувай W в kW)\n'+
  '- length: дължина на кабела в метри (число)\n'+
  '- phase: "1" за монофазен (220/230 V) или "3" за трифазен (380/400 V)\n'+
  '- cable: "svt" (СВТ), "nym" (мостов кабел, NYM, ПВВ), "savt" (САВТ), "nyy" (NYY), "nayy" (NAYY), "svtc" (СВТ-с)\n'+
  '- laying: "ground" (в земя), "air" (във въздух), "pipe" (в тръба или канал), "wall" (директно по стена или скара)\n'+
  '- cosphi: число от 0.1 до 1\n'+
  '- drop: допустим пад на напрежение в %\n'+
  '- curve: "B", "C" или "D" (характеристика на прекъсвача)\n'+
  'Ако нещо не е споменато в текста, сложи null. Не измисляй стойности. Всеки отделен уред или линия е отделен обект.\n'+
  'Пример: [{"name":"Бойлер","kw":2,"length":15,"phase":"1","cable":"svt","laying":null,"cosphi":null,"drop":null,"curve":null}]\n\nТекст:\n'+text;
 }

 function norm(it){
  if(!it||typeof it!=='object')return null;
  const c=mk();c.p='';c.l='';
  c.name=String(it.name||'').replace(/[<>]/g,'').slice(0,40).trim();
  const kw=num(it.kw);if(kw>0&&kw<5000)c.p=String(Math.round(kw*1000)/1000);
  const L=num(it.length);if(L>0&&L<100000)c.l=String(L);
  if(String(it.phase)==='3')c.tri=1;
  if(typeof it.cable==='string'&&has(T,it.cable)){c.type=it.cable;c.mat=T[it.cable].m;}
  const pf=num(it.cosphi);if(pf>=0.1&&pf<=1)c.pf=String(pf);
  const du=num(it.drop);if(du>0&&du<=20)c.du=String(du);
  const cv=String(it.curve||'').toUpperCase();if(has(MAG,cv))c.ch=cv;
  const lay=String(it.laying||'');
  if(c.type==='nym'){const k={pipe:'B2',wall:'C',air:'E'}[lay];if(k)c.mode=Object.keys(T.nym.md).find(x=>x.startsWith(k))||null;}
  else if(lay==='ground')c.mode='В земя';
  else if(lay==='air'||lay==='pipe'||lay==='wall')c.mode='Във въздух';
  return c;
 }

 function apply(items){
  const cs=items.slice(0,20).map(norm).filter(Boolean);
  if(!cs.length)return null;
  const d0=lines[0],pristine=lines.length===1&&d0.name===''&&d0.p==='7'&&d0.l==='30'&&d0.pf==='1'&&d0.du==='3'&&d0.tri===0&&d0.type==='svt'&&d0.auto===1;
  lines=pristine?cs:lines.concat(cs);
  renderAll();
  return cs;
 }

 go.onclick=async()=>{
  const text=ta.value.trim();
  if(!text){setSt('Кажете или напишете какво да се попълни.',true);return;}
  go.disabled=true;setSt('Анализирам…');
  try{
   await ready;
   let items,note='';
   if(SMP){
    try{items=await SMP.json(prompt(text),{modelTier:'quick',cache:false});}
    catch(e){items=localParse(text);note=' (AI не отговори, използван е основен разбор)';}
   }else items=localParse(text);
   if(!Array.isArray(items))items=items&&typeof items==='object'?[items]:[];
   const cs=apply(items);
   if(!cs){setSt('Не разпознах консуматор. Опитайте например: „Бойлер 2 киловата, 15 метра, СВТ, монофазен“.',true);}
   else{
    const miss=cs.filter(c=>c.p===''||c.l==='').length;
    setSt('Добавени консуматори: '+cs.length+'.'+(miss?' Липсват мощност или дължина за '+miss+' – допълнете ги ръчно.':' Проверете стойностите.')+note,miss>0);
    ta.value='';
   }
  }catch(e){setSt('Нещо се обърка. Опитайте пак.',true);}
  go.disabled=false;
 };
})();
themeBtns();
renderAll();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
